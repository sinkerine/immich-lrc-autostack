# Add this service to your Immich docker-compose.yaml (same project, so it can
# reach immich-server on the default network), or run it standalone and point
# IMMICH_API_URL at your server.
services:
  immich-lrc-autostack:
    build: https://github.com/sinkerine/immich-lrc-autostack.git
    env_file: .env                     # contains IMMICH_API_KEY
    environment:
      IMMICH_API_URL: http://immich-server:2283/api
      LRC_BACKUPS_DIRS: /backups/desktop,/backups/laptop  # one folder per catalog
      IMMICH_LIBRARY_PATH: /mnt/photos # the folder as mounted into immich-server
      # PATH_MAP: "P:/Photos/=/mnt/photos/"  # optional; auto-detected otherwise
      FOLDER_OWNER: newest-backup      # or latest-edit / all
      STATE_FILE: /state/state.json
      UNSTACK: "false"                 # "true" to follow unstacking in Lightroom
      INTERVAL: "3600"
      DRY_RUN: "true"                  # flip to "false" after checking the logs
    volumes:
      - ./lrc-autostack-state:/state   # writable by uid 1000
      - /path/to/desktop/lightroom/backups:/backups/desktop:ro
      - /path/to/laptop/lightroom/backups:/backups/laptop:ro
    restart: unless-stopped
